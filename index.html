<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daisy's Stage — A Play in Three Acts</title>
  <meta name="description" content="梁爽的个人作品集：一场三幕剧。剧评人的图书馆 · 央视放映厅 · 猫头鹰邮报。" />
  <meta name="theme-color" content="#17100c" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2317100c'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-style='italic' font-size='46' fill='%23c9a86a' text-anchor='middle'%3ED%3C/text%3E%3Ccircle cx='50' cy='15' r='3' fill='%23f6e2a8'/%3E%3C/svg%3E" />
  <link rel="preload" as="image" href="assets/art/stage-cartoon.jpg" />
  <!-- 字体本地化：零外网延迟，首屏字形一次到位，不再 fallback→花体跳变 -->
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/great-vibes-latin-400-normal.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/caveat-latin-500-normal.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/playfair-display-latin-700-normal.woff2" crossorigin />
  <script type="module" crossorigin src="./assets/index--MJDkh1h.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BYTRBa6V.css">
</head>
<body>
  <!-- 全局质感层 -->
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- 魔法棒光标 -->
  <div id="wand" aria-hidden="true">
    <svg viewBox="0 0 40 40"><path d="M33 31 L12 11" stroke="#c9a86a" stroke-width="3" stroke-linecap="round"/><path d="M12 7 L12 3 M12 15 L12 19 M8 11 L4 11 M16 11 L20 11 M9.5 8.5 L7 6 M14.5 13.5 L17 16" stroke="#f6e2a8" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="11" r="2.8" fill="#f9efcf"/></svg>
  </div>
  <div id="sparkleLayer" aria-hidden="true"></div>

  <!-- ═══ 首屏 ═══ -->
  <section id="intro" class="intro">
    <div class="intro-glow" aria-hidden="true"></div>
    <div class="intro-title-wrap">
      <svg class="title-arc" viewBox="0 0 600 120" aria-hidden="true">
        <path id="arcPath" d="M40 100 Q300 -30 560 100" fill="none" stroke="none"/>
        <circle id="arcComet" r="3.5" fill="#f9efcf" opacity="0"/>
      </svg>
      <h1 id="mainTitle" class="main-title" aria-label="Daisy's Stage"></h1>
      <div class="title-sparkles" id="titleSparkles" aria-hidden="true"></div>
      <p class="intro-slogan">Life's a play. Trying every role.</p>
    </div>
    <p class="intro-zh">梁爽的个人作品集 · 一场三幕剧</p>

    <button id="ticket" class="ticket" aria-label="撕下票根，进入剧场">
      <span class="t-main">
        <span class="t-head">ADMIT ONE</span>
        <span class="t-show">Daisy's Stage</span>
        <span class="t-cta">— The Show Is About to Begin —</span>
        <span class="t-meta"><b>SEC</b> A · <b>ROW</b> 1 · <b>SEAT</b> 01 · <b>DATE</b> TONIGHT</span>
      </span>
      <span class="t-tear" aria-hidden="true"></span>
      <span class="t-stub">
        <span class="t-stub-vert">KEEP THIS STUB</span>
        <span class="t-no">№ 001207</span>
      </span>
    </button>
    <p class="intro-foot">撕下票根，演出开场 · Tear the stub to enter</p>
  </section>

  <!-- ═══ 幕布转场：舞台边框固定，两片同源天鹅绒幕布受绳牵引开合 ═══ -->
  <div id="curtainOverlay" class="curtain-overlay" hidden>
    <!-- 固定舞台：拱门立柱 + 顶部花饰全程不动，与剧场背景同源 -->
    <div class="c-stage" aria-hidden="true"></div>
    <!-- 台口：两片真实幕布只在此开口内左右开合 -->
    <div class="c-opening" aria-hidden="true">
      <div class="c-curtain c-cl"><span class="c-cloth"></span><span class="c-edge"></span></div>
      <div class="c-curtain c-cr"><span class="c-cloth"></span><span class="c-edge"></span></div>
      <!-- 顶部垂幔流苏：固定在台口上沿，遮住帘幕顶缝，增强一体感 -->
      <div class="c-valance"></div>
    </div>
    <!-- 牵引金绳（合拢/拉开时从两侧垂下轻摆） -->
    <div class="c-pull c-pull-l" aria-hidden="true"><span></span></div>
    <div class="c-pull c-pull-r" aria-hidden="true"><span></span></div>
    <div class="c-caption">
      <span class="c-act" id="cAct"></span>
      <span class="c-title" id="cTitle"></span>
      <span class="c-zh" id="cZh"></span>
    </div>
  </div>

  <!-- ═══ 剧场 ═══ -->
  <main id="theater" hidden>
    <div class="frame" id="frame">
      <!-- L0 背幕天幕 -->
      <div class="layer l-backdrop" data-depth="0.35" aria-hidden="true">
        <img src="assets/art/stage-cartoon.jpg" alt="" />
      </div>

      <!-- L1 金色飘尘 -->
      <div class="layer l-dust" id="dust" data-depth="0.6" aria-hidden="true"></div>

      <!-- L2 舞台内容（各幕） -->
      <div class="layer l-content" data-depth="1">
        <section class="actscene" id="act-library" hidden></section>
        <section class="actscene" id="act-onair" hidden></section>
        <section class="actscene" id="act-post" hidden></section>
        <section class="actscene" id="act-finale" hidden></section>
      </div>

      <!-- 幕名牌 -->
      <div class="act-sign" id="actSign">
        <span class="as-num" id="asNum"></span>
        <span class="as-title" id="asTitle"></span>
      </div>

      <!-- 金绳拉绳：从舞台背景原图抠出的真实束绳（绳结 + 流苏），保留微光与文字指引 -->
      <button id="rope" class="rope" aria-label="拉动金绳，进入下一幕">
        <span class="rope-glow" aria-hidden="true"></span>
        <img class="rope-art" src="assets/rope/curtain-tieback.png" alt="" aria-hidden="true" />
        <span class="rope-hint hand" id="ropeHint">Pull for the next act</span>
        <span class="rope-lock hand" id="ropeLock">先看完这一幕 · 再赴下一场</span>
      </button>

      <!-- 节目单 -->
      <nav class="playbill" id="playbill" aria-label="节目单">
        <div class="pb-head hand">Tonight's Program</div>
        <ol class="pb-list" id="pbList"></ol>
      </nav>
    </div>
  </main>

  <!-- 详情弹层（羊皮纸卡片） -->
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-modal-close></div>
    <div class="modal-card" id="modalCard"></div>
  </div>

  <!-- 移动端竖屏版（JS 渲染） -->
  <div id="mobile" class="mobile"></div>

</body>
</html>
